
name: myworkflow_oct31

on:
  push:

jobs:
  myjob1:
    runs-on: ubuntu-latest

    steps:
      - name: mystep1
        run: |
          whoami
          cat /etc/os-release
          docker --version
          docker compose version
          systemctl status docker
      - name: mystep2 - checkout the source code
        uses: actions/checkout@v4
      - name: mystep3- check if source code is available
        run: ls -al
      - name: mystep4- image build
        run: |
          docker image build -t kabiramb/myimage2:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5-  check if image is available
        run: docker images



